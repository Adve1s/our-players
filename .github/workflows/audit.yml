# GitHub's dependency graph can't read the pnpm 12 lockfile, so Dependabot never alerts on
# transitive deps (S16 P1). This weekly pnpm audit fills that gap: a red run emails the owner.
name: Audit

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - run: corepack enable
      - run: pnpm audit
      # The step above gates on high (dev and build tools carry accepted moderates); the API's own runtime
      # dependencies face the internet, so they fail on moderate too.
      - if: ${{ !cancelled() }}
        run: pnpm --filter @our-players/server audit --prod --audit-level moderate
