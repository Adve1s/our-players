name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 24 follows .tool-versions so CI tracks the local pin; 22 is the floor cloud sessions run.
          node-version: ${{ matrix.node == 22 && '22' || '' }}
          node-version-file: ${{ matrix.node == 24 && '.tool-versions' || '' }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
