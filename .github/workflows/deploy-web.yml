name: Deploy web

# A push that can change the site deploys it; workflow_dispatch redeploys by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read

concurrency: deploy-web

jobs:
  deploy:
    # Only main is reviewed and CI-checked; a hand-started run on another branch skips.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Cloudflare secrets live on this environment, which only main may deploy from.
    environment: production
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.WEB_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - run: corepack enable
      - name: Check WEB_API_URL
        # Unset, the site would call http://localhost:3001; http:// is blocked from an https page.
        run: |
          case "$EXPO_PUBLIC_API_URL" in
            https://*) ;;
            *) echo "::error::Set the WEB_API_URL repository variable to the API's https:// URL"; exit 1 ;;
          esac
          # The CSP allows fetches only to the API it names; a different URL would deploy a site whose every call is blocked.
          grep -qF "connect-src ${EXPO_PUBLIC_API_URL%/};" apps/mobile/public/_headers ||
            { echo "::error::WEB_API_URL is not the connect-src in apps/mobile/public/_headers; change both together"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      # This job holds the Cloudflare token: run wrangler from the lockfile, which pins its whole dependency tree.
      - run: pnpm exec wrangler deploy
        working-directory: apps/mobile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
