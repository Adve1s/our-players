<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Cuts the sun at the middle of the horizon bar, so the mark also works on transparent layers. -->
    <clipPath id="horizon"><rect width="1024" height="666"/></clipPath>
  </defs>
  <rect id="field" width="1024" height="1024" fill="#1D2024"/>
  <!-- Fits Android's adaptive safe zone (a 66/108 circle): its farthest point is 30/108 from the center. -->
  <g id="mark">
    <circle cx="512" cy="640" r="162" fill="#FFB547" clip-path="url(#horizon)"/>
    <rect x="290" y="640" width="444" height="51" rx="25.5" fill="#F5F5F4"/>
    <path d="M512 427V358M361 489L313 441M663 489L711 441" fill="none" stroke="#FFB547" stroke-width="51" stroke-linecap="round"/>
  </g>
</svg>
